CONFIG_RADIO_BRIDGE_NEW_STACK=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=252
CONFIG_ESB_PIPE_COUNT=4
CONFIG_ESB_SYS_TIMER1=y
CONFIG_ESB_DYNAMIC_INTERRUPTS=y
CONFIG_MPSL_DYNAMIC_INTERRUPTS=y
CONFIG_ESB_MPSL_TIMESLOT=n
CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HWINFO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=100
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_GPIOTE=y
CONFIG_NRFX_GPPI=y
CONFIG_CLOCK_CONTROL=y
CONFIG_MPSL=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_THREAD_NAME=y

# Runtime role configuration with NVS persistence (see param_config.c)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
# Without this, the SETTINGS_BACKEND choice has no eligible backend and
# silently falls back to SETTINGS_NONE, so settings_save_one() always fails
# with -ENOENT and every param set is lost on reboot.
CONFIG_NVS=y

# CDC Shell for runtime role configuration
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="uart:~$ "
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_PRINTF_BUFF_SIZE=128

# Watchdog - 自动重启防止卡死 (30秒超时)
CONFIG_WATCHDOG=y
CONFIG_WDT_NRFX=y

# The shell backend's interrupt-driven mode selects the global
# UART_INTERRUPT_DRIVEN option, which flips the per-instance default for
# EVERY nRF UARTE instance to interrupt-driven -- including physical uart0
# (the data bridge UART), even though the shell itself runs over the CDC ACM
# virtual console, not uart0. uart_bridge.c requires uart0's async API
# (uart_callback_set/uart_rx_enable/uart_tx); force it back explicitly.
CONFIG_UART_0_INTERRUPT_DRIVEN=n
CONFIG_UART_0_ASYNC=y
CONFIG_UART_1_INTERRUPT_DRIVEN=n
CONFIG_UART_1_ASYNC=y
# uart_bridge_init() calls uart_configure() at runtime to apply the
# baud/parity/stop-bit settings read from the param system. Without this,
# z_impl_uart_configure() short-circuits to -ENOTSUP before ever reaching
# the driver, regardless of UART_0_ASYNC.
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_RADIO_BRIDGE_GROUP_ID=1
CONFIG_RADIO_BRIDGE_GROUP_KEY="00112233445566778899aabbccddeeff"
CONFIG_RADIO_BRIDGE_UART_BAUDRATE=115200
CONFIG_TIME_UART_BAUDRATE=9600
CONFIG_RADIO_BRIDGE_UART_RING_SIZE=16384
CONFIG_RADIO_BRIDGE_AGGREGATION_TIMEOUT_US=1000
CONFIG_RADIO_BRIDGE_SYNC_INTERVAL_US=100000
CONFIG_RADIO_BRIDGE_MAX_SLAVES=3
CONFIG_RADIO_BRIDGE_RESPONSE_SLOT_COUNT=8
CONFIG_RADIO_BRIDGE_RESPONSE_SLOT_US=500
CONFIG_RADIO_BRIDGE_ASSIGNMENT_WINDOW_US=6000
CONFIG_RADIO_BRIDGE_LEASE_TIMEOUT_US=100000
CONFIG_RADIO_BRIDGE_IDLE_POLL_MAX_US=5000
CONFIG_TIME_SYNC_PPS_PERIOD_US=1000000
CONFIG_TIME_SYNC_PPS_WIDTH_US=100
CONFIG_TIME_SYNC_STATUS_INTERVAL_MS=1000
CONFIG_REBOOT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_TIME_SYNC_LED_HEARTBEAT=y
