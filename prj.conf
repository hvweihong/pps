CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=252
CONFIG_ESB_PIPE_COUNT=4
CONFIG_ESB_SYS_TIMER1=y
CONFIG_ESB_DYNAMIC_INTERRUPTS=y
CONFIG_MPSL_DYNAMIC_INTERRUPTS=y
CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HWINFO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=100
CONFIG_NRFX_GPIOTE=y
CONFIG_CLOCK_CONTROL=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Runtime role configuration with NVS persistence (see param_config.c)
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
# Without this, the SETTINGS_BACKEND choice has no eligible backend and
# silently falls back to SETTINGS_NONE, so settings_save_one() always fails
# with -ENOENT and every param set is lost on reboot.
CONFIG_NVS=y

# CDC Shell for runtime role configuration
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_PRINTF_BUFF_SIZE=128

# Watchdog - 自动重启防止卡死 (30秒超时)
CONFIG_WATCHDOG=y

# The shell backend's interrupt-driven mode selects the global
# UART_INTERRUPT_DRIVEN option, which flips the per-instance default for
# EVERY nRF UARTE instance to interrupt-driven -- including physical uart0
# (the data bridge UART), even though the shell itself runs over the CDC ACM
# virtual console, not uart0. uart_bridge.c requires uart0's async API
# (uart_callback_set/uart_rx_enable/uart_tx); force it back explicitly.
CONFIG_UART_0_INTERRUPT_DRIVEN=n
CONFIG_UART_1_INTERRUPT_DRIVEN=n
# uart_bridge_init() calls uart_configure() at runtime to apply the
# baud/parity/stop-bit settings read from the param system. Without this,
# z_impl_uart_configure() short-circuits to -ENOTSUP before ever reaching
# the driver, regardless of UART_0_ASYNC.
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_REBOOT=y
CONFIG_UART_LINE_CTRL=y
